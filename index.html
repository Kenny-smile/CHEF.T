<!DOCTYPE html>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #fff5ed;
            color: #333;
        }

        header {
            background: #8b2f23;
            color: white;
            padding: 15px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .top-bar {
            max-width: 1200px;
            margin: auto;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            white-space: nowrap;
        }

        .search {
            flex: 1;
            display: flex;
        }

        .search input {
            width: 100%;
            padding: 12px;
            border: none;
            outline: none;
            border-radius: 6px 0 0 6px;
        }

        .search button {
            background: #f4c7a1;
            color: #7a281d;
            border: none;
            padding: 0 18px;
            border-radius: 0 6px 6px 0;
            cursor: pointer;
            font-weight: bold;
        }

        .cart-btn {
            background: #f4c7a1;
            color: #7a281d;
            border: none;
            padding: 11px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .categories {
            max-width: 1200px;
            margin: 15px auto 0;
            display: flex;
            gap: 8px;
            overflow-x: auto;
        }

        .categories button {
            background: white;
            color: #8b2f23;
            border: none;
            padding: 10px 16px;
            border-radius: 20px;
            white-space: nowrap;
            cursor: pointer;
            font-weight: bold;
        }

        .categories button:hover {
            background: #f4c7a1;
        }

        .page {
            display: none;
            max-width: 1200px;
            margin: auto;
            padding: 25px 15px;
        }

        .page.active {
            display: block;
        }

        .hero {
            background: #f4c7a1;
            color: #7a281d;
            padding: 45px 20px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 30px;
        }

        .hero h1 {
            font-size: 35px;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 17px;
        }

        .section-title {
            color: #7a281d;
            margin-bottom: 20px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 18px;
        }

        .product-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .product-image {
            width: 100%;
            height: 170px;
            background: #fff0e4;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 75px;
        }

        .product-info {
            padding: 13px;
        }

        .product-name {
            font-weight: bold;
            margin-bottom: 8px;
        }

        .price {
            color: #8b2f23;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .add-btn {
            width: 100%;
            background: #8b2f23;
            color: white;
            border: none;
            padding: 11px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .add-btn:hover {
            background: #6e241b;
        }

        .back-btn {
            background: #8b2f23;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .page-title {
            color: #7a281d;
            margin-bottom: 20px;
            font-size: 28px;
        }

        footer {
            background: #8b2f23;
            color: white;
            text-align: center;
            padding: 25px 15px;
            margin-top: 40px;
        }

        footer p {
            margin: 6px 0;
        }

        @media (max-width: 900px) {
            .products {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 600px) {

            .top-bar {
                flex-wrap: wrap;
            }

            .logo {
                width: 100%;
                text-align: center;
            }

            .search {
                width: 100%;
                order: 3;
            }

            .products {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .product-image {
                height: 140px;
                font-size: 60px;
            }

            .hero h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<script>

    /* =========================
       CART
    ========================= */

    let cart = [];


    /* =========================
       PAGE NAVIGATION
    ========================= */

    function hidePages() {

        document.getElementById("homePage")
            .classList.remove("active");

        document.getElementById("categoryPage")
            .classList.remove("active");

        document.getElementById("searchPage")
            .classList.remove("active");

        document.getElementById("orderPage")
            .classList.remove("active");

    }


    function goHome() {

        hidePages();

        document.getElementById("homePage")
            .classList.add("active");

        window.scrollTo(0, 0);

    }


    function openCategory(category) {

        hidePages();

        document.getElementById("categoryPage")
            .classList.add("active");

        document.getElementById("categoryTitle")
            .textContent = category;

        showCategoryProducts(category);

        window.scrollTo(0, 0);

    }


    function openOrder() {

        hidePages();

        document.getElementById("orderPage")
            .classList.add("active");

        displayOrder();

        window.scrollTo(0, 0);

    }


    /* =========================
       ADD TO ORDER
    ========================= */

    function addToOrder(name, price, sticker) {

        let existing = cart.find(function(item) {
            return item.name === name;
        });


        if (existing) {

            existing.quantity++;

        } else {

            cart.push({

                name: name,

                price: price,

                quantity: 1,

                sticker: sticker

            });

        }


        updateCartCount();

        alert(name + " added to your order!");

    }


    /* =========================
       PLUS
    ========================= */

    function increaseQuantity(index) {

        cart[index].quantity++;

        updateCartCount();

        displayOrder();

    }


    /* =========================
       MINUS
    ========================= */

    function decreaseQuantity(index) {

        if (cart[index].quantity > 1) {

            cart[index].quantity--;

        } else {

            cart.splice(index, 1);

        }


        updateCartCount();

        displayOrder();

    }


    /* =========================
       CART COUNT
    ========================= */

    function updateCartCount() {

        let totalQuantity = 0;

        cart.forEach(function(item) {

            totalQuantity += item.quantity;

        });


        document.getElementById("cartCount")
            .textContent = totalQuantity;

    }


    /* =========================
       DISPLAY ORDER
    ========================= */

    function displayOrder() {

        const container =
            document.getElementById("orderItems");

        const totalBox =
            document.getElementById("orderTotal");


        if (cart.length === 0) {

            container.innerHTML = `
                <p style="
                    text-align:center;
                    padding:30px;
                    color:#777;
                ">
                    Your order is empty.
                </p>
            `;

            totalBox.textContent = "0";

            return;

        }


        let total = 0;


        container.innerHTML = cart.map(function(item, index) {

            let amount =
                item.price * item.quantity;

            total += amount;


            return `

                <div style="
                    display:flex;
                    align-items:center;
                    gap:12px;
                    padding:15px 0;
                    border-bottom:1px solid #eee;
                ">

                    <div style="
                        width:65px;
                        height:65px;
                        background:#fff0e4;
                        border-radius:10px;
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        font-size:38px;
                        flex-shrink:0;
                    ">
                        ${item.sticker}
                    </div>


                    <div style="flex:1;">

                        <div style="
                            font-weight:bold;
                            color:#333;
                            margin-bottom:5px;
                        ">
                            ${item.name}
                        </div>

                        <div style="
                            color:#8b2f23;
                            font-weight:bold;
                        ">
                            ₦${item.price.toLocaleString()}
                        </div>

                    </div>


                    <div style="
                        display:flex;
                        align-items:center;
                        gap:8px;
                    ">

                        <button
                            onclick="decreaseQuantity(${index})"
                            style="
                                width:32px;
                                height:32px;
                                border:none;
                                border-radius:6px;
                                background:#8b2f23;
                                color:white;
                                font-size:20px;
                                cursor:pointer;
                            "
                        >
                            −
                        </button>


                        <strong>
                            ${item.quantity}
                        </strong>


                        <button
                            onclick="increaseQuantity(${index})"
                            style="
                                width:32px;
                                height:32px;
                                border:none;
                                border-radius:6px;
                                background:#8b2f23;
                                color:white;
                                font-size:20px;
                                cursor:pointer;
                            "
                        >
                            +
                        </button>

                    </div>


                    <div style="
                        min-width:90px;
                        text-align:right;
                        font-weight:bold;
                    ">
                        ₦${amount.toLocaleString()}
                    </div>

                </div>

            `;

        }).join("");


        totalBox.textContent =
            total.toLocaleString();

    }


    /* =========================
       WHATSAPP ORDER
    ========================= */

    function placeOrder() {

        if (cart.length === 0) {

            alert("Please add something to your order first.");

            return;

        }


        const name =
            document.getElementById("customerName").value.trim();

        const phone =
            document.getElementById("customerPhone").value.trim();

        const orderType =
            document.getElementById("orderType").value;

        const address =
            document.getElementById("customerAddress").value.trim();


        if (!name || !phone || !orderType || !address) {

            alert("Please fill in all your details.");

            return;

        }


        let message =
            "Hello CHEF. T!%0A%0A";

        message +=
            "I would like to place an order.%0A%0A";


        let total = 0;


        cart.forEach(function(item) {

            let amount =
                item.price * item.quantity;

            total += amount;


            message +=
                item.name +
                " x" +
                item.quantity +
                " = ₦" +
                amount.toLocaleString() +
                "%0A";

        });


        message +=
            "%0ATotal: ₦" +
            total.toLocaleString();

        message +=
            "%0AOrder Type: " +
            orderType;

        message +=
            "%0ACustomer Name: " +
            name;

        message +=
            "%0APhone: " +
            phone;

        message +=
            "%0AAddress: " +
            address;


        /* CHANGE THIS TO CHEF. T'S REAL WHATSAPP NUMBER */

        const whatsappNumber =
            "2348029853082";


        window.open(
            "https://wa.me/" +
            whatsappNumber +
            "?text=" +
            message,
            "_blank"
        );

    }

</script>

    /* =========================
       CREATE PRODUCT CARD
    ========================= */

    function productCard(product) {

        let visual = "";

        if (product.image !== "") {

            visual = `
                <img
                    src="${product.image}"
                    alt="${product.name}"
                    style="
                        width:100%;
                        height:100%;
                        object-fit:cover;
                        border-radius:10px;
                    "
                >
            `;

        } else {

            visual = `
                <span class="sticker">
                    ${product.sticker}
                </span>
            `;
        }

        return `
            <div class="product-card">

                <div class="product-image">
                    ${visual}
                </div>

                <div class="product-info">

                    <div class="product-name">
                        ${product.name}
                    </div>

                    <div class="price">
                        ₦${product.price.toLocaleString()}
                    </div>

                    <button
                        class="add-btn"
                        onclick="addToOrder(
                            '${product.name}',
                            ${product.price},
                            '${product.sticker}'
                        )"
                    >
                        Add to Order
                    </button>

                </div>

            </div>
        `;
    }

    /* =========================
       CATEGORY PAGE
    ========================= */

    function showCategoryProducts(category) {

        const container =
            document.getElementById("categoryProducts");

        if (!products[category]) {

            container.innerHTML =
                "<p>Category not found.</p>";

            return;
        }

        container.innerHTML =
            products[category].map(productCard).join("");
    }


    /* =========================
       SEARCH
    ========================= */

    function searchFood() {

        const input =
            document.getElementById("searchInput");

        const searchText =
            input.value.trim().toLowerCase();

        if (searchText === "") {

            goHome();
            return;
        }

        hidePages();

        document
            .getElementById("searchPage")
            .classList.add("active");

        const allProducts =
            Object.values(products).flat();

        const results =
            allProducts.filter(function(product) {

                return product.name
                    .toLowerCase()
                    .includes(searchText);

            });

        const container =
            document.getElementById("searchProducts");

        if (results.length === 0) {

            container.innerHTML = `
                <div style="
                    background:white;
                    padding:30px;
                    border-radius:12px;
                    text-align:center;
                    grid-column:1/-1;
                ">
                    <h3>No food found 😔</h3>
                    <p>
                        Try searching for rice, cake,
                        shawarma, drinks or something else.
                    </p>
                </div>
            `;

        } else {

            container.innerHTML =
                results.map(productCard).join("");
        }

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    }


    /* =========================
       SEARCH WITH ENTER KEY
    ========================= */

    document
        .getElementById("searchInput")
        .addEventListener("keydown", function(event) {

            if (event.key === "Enter") {

                searchFood();

            }

        });


    /* =========================
       START HOME PAGE
    ========================= */

    loadHomeProducts();

    updateCartCount();

</script>
